# Rebuilds the profile README: every day for the signal (contribution) panel,
# and whenever the site's deploy sends a new tools/logs.json.
name: update

on:
  schedule:
    - cron: '17 3 * * *'
  push:
    branches: [main]
    paths: [tools/logs.json]
  workflow_dispatch:

permissions:
  contents: write

concurrency: update

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - run: node tools/contrib.mjs feelgxxd
      - run: node tools/build.mjs
      - name: Commit if anything changed
        run: |
          git add -A README.md assets tools/contrib.json
          if git diff --cached --quiet; then echo "nothing changed"; exit 0; fi
          git -c user.name=feelgxxd -c user.email=68569245+feelgxxd@users.noreply.github.com \
            commit -m "update profile: signal and logs"
          git push
